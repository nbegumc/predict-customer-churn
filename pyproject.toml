[project]
name = "predict-customer-churn"
version = "0.1.0"
description = "Local-first Kaggle competition setup"
requires-python = ">=3.11,<3.13"
# Runtime only: what src/predict.py and src/api.py actually import, and nothing
# else. Every package a serving container never executes lives in a group
# below, which is the difference between a ~400MB image and a ~2.5GB one.
# scipy arrives transitively via lightgbm, so it is not listed twice.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.0",
]

[dependency-groups]
# Training only. src/cv.py imports sklearn at module level and src/blend.py
# needs scipy.optimize; catboost is a blend member the serving image never loads.
train = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "catboost>=1.2",
]
notebook = [
    "jupyter",
    "ipykernel",
    "nbstripout",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    # explainability — usually worth more judging points than 3 more of AUC
    "shap>=0.44",
]
kaggle = ["kaggle"]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
]
# Tracking, drift reporting and data versioning. Deliberately kept out of
# `serve`: evidently pulls plotly and nltk, and drift is a batch question.
mlops = [
    "mlflow>=2.17",
    "evidently>=0.4",
    "dvc>=3.55",
]
# README ranks tuning last and nothing imports it yet, so it is opt-in:
# `uv run --group tuning ...`.
tuning = ["optuna>=3.5"]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

# src/ is imported as a namespace package from the repo root (python -m src.train),
# not installed into site-packages, so uv manages dependencies only.
[tool.uv]
package = false
# Restores the pre-split behaviour of a bare `uv sync`, so the daily workflow is
# unchanged. The Docker build opts out with `--no-default-groups --group serve`.
default-groups = ["train", "notebook", "kaggle", "mlops", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["realdata: needs data/raw, which is gitignored (skipped when absent)"]
# src/ is a namespace package imported from the repo root rather than installed
# (`package = false` above), so pytest needs the root on sys.path to see it.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501", "E741"]   # long lines, ambiguous names like `l`

[tool.ruff.lint.per-file-ignores]
# BLE001 (blind except) is right in general and wrong for one pattern: code that
# isolates a *secondary* sink -- MLflow tracking, the LB mirror -- whose backends
# can raise anything (sqlalchemy, requests, OSError, MlflowException) and must
# never take training or a recorded score down with them. Scoped to the files
# that do that, so the rule stays on everywhere else.
"src/utils.py" = ["BLE001"]
"src/log_lb.py" = ["BLE001"]
