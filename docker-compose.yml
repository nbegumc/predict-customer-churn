# Local stack: the scoring API and the tracking server it logs to.
#
#   cp .env.example .env     # set MODEL_RUN_ID to a bundle in models/
#   docker compose up -d
#   open http://localhost:8000   (API)  /  http://localhost:5001  (MLflow; 5000 is macOS AirPlay)
#
# Local only, by choice. There is no deploy target here; docs/deployment.md
# records what running this somewhere else would involve.

services:
  api:
    build:
      context: .
      args:
        # Baked into the image, so an image is never ambiguous about its model.
        MODEL_RUN_ID: ${MODEL_RUN_ID:?set MODEL_RUN_ID in .env — see .env.example}
    image: churn-api:${MODEL_RUN_ID:-local}
    ports:
      - "8000:8000"
    environment:
      # fold_average is the default; full_refit is the other strategy in the
      # same bundle. Switching is a restart, not a rebuild.
      MODEL_STRATEGY: ${MODEL_STRATEGY:-fold_average}
    volumes:
      # The prediction log src.monitor reads. The only writable path the
      # container needs; everything else is immutable in the image.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    # The same store the host writes: src/config.py keeps the database at
    # mlruns/mlflow.db beside the artifacts. MLflow records artifact locations
    # as *absolute* host paths (/Users/.../mlruns/1/...), so the directory is
    # mounted at that same absolute path -- mounting it anywhere else gives the
    # UI runs whose artifacts it cannot open. Run compose from the repo root
    # (`make up`), since ${PWD} is what makes the two paths agree.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///${PWD}/mlruns/mlflow.db
      --default-artifact-root ${PWD}/mlruns
    ports:
      # 5001 on the host: macOS AirPlay Receiver (ControlCenter) holds 5000.
      - "5001:5000"
    volumes:
      - ./mlruns:${PWD}/mlruns
    restart: unless-stopped
